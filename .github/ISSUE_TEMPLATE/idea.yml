name: An idea
description: Something the app could do, show or explain
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like to see or try? Sketches and screenshots welcome.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What it would help with
      description: Optional. What you'd learn from it, or what's awkward now.
